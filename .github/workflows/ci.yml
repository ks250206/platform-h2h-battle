name: Verify game

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Upload playable production build
        uses: actions/upload-artifact@v4
        with:
          name: bramble-web-build
          path: dist/
          retention-days: 14

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - run: pnpm install --frozen-lockfile
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: bramble-web-build
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E (shard ${{ matrix.shard }}/4)
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
